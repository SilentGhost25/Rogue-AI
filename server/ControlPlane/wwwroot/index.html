<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BREACH COMMAND — Organizer Control Plane</title>
<style>
  :root {
    --bg: #0b1319;
    --panel: #13222d;
    --panel-sub: #0e1922;
    --ink: #eaf1f5;
    --mute: #8da4b3;
    --line: #223746;
    --accent: #ff4757;
    --ok: #2ed573;
    --warn: #ffa502;
    --cyan: #1e90ff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }
  
  header {
    background: #111e28;
    border-bottom: 1px solid var(--line);
    padding: 0.8rem 1.5rem;
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  .title-group { display: flex; align-items: center; gap: 0.8rem; }
  .badge-icon { background: var(--accent); color: #fff; font-weight: 900; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
  .status-pill { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: #1a2c38; color: var(--mute); border: 1px solid var(--line); }
  .status-pill.online { background: rgba(46, 213, 115, 0.15); color: var(--ok); border-color: var(--ok); }
  
  .grow { flex: 1; }
  .hdr-controls { display: flex; gap: 0.6rem; align-items: center; }
  input, select, button { font: inherit; color: var(--ink); background: var(--panel-sub); border: 1px solid var(--line); border-radius: 4px; padding: 0.4rem 0.7rem; }
  input:focus, select:focus { outline: 2px solid var(--cyan); border-color: transparent; }
  button { cursor: pointer; background: #1c3242; transition: all 0.15s; font-weight: 600; }
  button:hover { background: #244157; border-color: #355873; }
  button.btn-danger { background: rgba(255, 71, 87, 0.2); border-color: var(--accent); color: var(--accent); }
  button.btn-danger:hover { background: var(--accent); color: #fff; }
  button.btn-ok { background: rgba(46, 213, 115, 0.2); border-color: var(--ok); color: var(--ok); }
  button.btn-ok:hover { background: var(--ok); color: #000; }
  button.btn-warn { background: rgba(255, 165, 2, 0.2); border-color: var(--warn); color: var(--warn); }
  button.btn-warn:hover { background: var(--warn); color: #000; }

  .top-action-bar {
    display: flex;
    gap: 10px;
    padding: 0.8rem 1.5rem;
    background: #0d1720;
    border-bottom: 1px solid var(--line);
  }
  .top-action-bar button, .top-action-bar a {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 70px;
    gap: 4px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 6px;
    padding: 0.2rem;
  }
  .top-action-bar a button {
    width: 100%;
    height: 100%;
  }

  main { flex: 1; display: grid; grid-template-columns: 24rem 1fr; gap: 1.25rem; padding: 1.25rem; }
  aside { display: flex; flex-direction: column; gap: 1.25rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1rem; }
  h2 { font-size: 0.95rem; margin: 0 0 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--mute); display: flex; justify-content: space-between; align-items: center; }

  /* Attacks */
  .attack-item {
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.7rem;
    margin-bottom: 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .attack-title { font-weight: 700; font-size: 0.9rem; }
  .attack-desc { font-size: 0.8rem; color: var(--mute); }
  .attack-actions { display: flex; gap: 0.5rem; margin-top: 0.3rem; }
  .attack-actions button { flex: 1; font-size: 0.8rem; padding: 0.35rem 0.5rem; }

  /* Tabs */
  .tabs-nav { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; padding-bottom: 0.5rem; }
  .tab-btn { background: transparent; border: none; font-size: 0.95rem; padding: 0.4rem 0.8rem; color: var(--mute); border-radius: 4px; }
  .tab-btn.active { background: #1c3242; color: var(--ink); font-weight: 700; }

  /* Participant Tiles Grid */
  .tiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.75rem;
  }
  .kiosk-card {
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.7rem;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .kiosk-card:hover { transform: translateY(-2px); border-color: var(--cyan); }
  .kiosk-card.dead { border-color: var(--accent); background: rgba(255, 71, 87, 0.08); }
  .kiosk-card.warn-quota { border-color: var(--warn); }
  .kc-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.85rem; }
  .kc-name { font-size: 0.8rem; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kc-score { font-size: 1.1rem; font-weight: 800; color: var(--ok); margin-top: 0.2rem; }
  .kc-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--mute); margin-top: 0.3rem; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--line); }
  th { font-size: 0.8rem; color: var(--mute); text-transform: uppercase; background: var(--panel-sub); }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); display: none; place-items: center; z-index: 100;
  }
  .modal-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    width: 650px; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-hdr { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <div class="badge-icon">&#x26A0;</div>
    <h1>BREACH COMMAND &bull; CONTROL PLANE</h1>
    <span id="connStatus" class="status-pill">Connecting...</span>
    <span id="backupStatus" class="status-pill" style="margin-left:8px; border-color:var(--border)">&#x1F4BE; Backup: Checking...</span>
  </div>
  <div class="grow"></div>
  <div class="hdr-controls">
    <label style="font-size:12px; color:var(--mute)">Admin Key: <input id="adminKey" type="password" style="width:220px" value="CHANGE-ME-BEFORE-EVENT"></label>
  </div>
</header>

<div class="top-action-bar">
  <button id="btnRefresh" title="Refresh kiosks, leaderboard, attacks, and events">
    <span style="font-size:1.3rem">&#x21BB;</span>
    <span>Refresh</span>
  </button>
  <button id="btnPause" class="btn-warn">
    <span style="font-size:1.3rem">&#x23F8;</span>
    <span>Pause Event</span>
  </button>
  <button id="btnResume" class="btn-ok">
    <span style="font-size:1.3rem">&#x25B6;</span>
    <span>Resume</span>
  </button>
  <button id="btnFreeze" class="btn-warn">
    <span style="font-size:1.3rem">&#x2744;</span>
    <span>Freeze Board</span>
  </button>
  <button id="btnExport" title="Export raw SQLite score ledger">
    <span style="font-size:1.3rem">&#x1F4E5;</span>
    <span>Export CSV</span>
  </button>
  <button id="btnResetSession" class="btn-danger" title="Wipe all participant sessions and score ledger">
    <span style="font-size:1.3rem">&#x1F6A8;</span>
    <span>Reset Event Data</span>
  </button>
  <a href="/projector.html" target="_blank">
    <button style="background:var(--cyan); color:#fff; border-color:var(--cyan)">
      <span style="font-size:1.3rem">&#x1F4FA;</span>
      <span>Projector View</span>
    </button>
  </a>
</div>

<main>
  <!-- Left Side: Attacks & Actions -->
  <aside>
    <section class="card">
      <h2><span>Intrusion Dispatch</span></h2>
      <div style="margin-bottom:0.8rem">
        <label style="font-size:11px; color:var(--mute); display:block; margin-bottom:4px">Target Scope:</label>
        <select id="targetScope" style="width:100%">
          <option value="">&bull; ALL ACTIVE PARTICIPANTS</option>
        </select>
        <button id="btnAssignGroups" onclick="assignGroups()" style="width:100%; margin-top:6px; background:#1c3242; border-color:var(--ok); color:var(--ok)">&#x1F3B2; Assign Attacks (Groups of 5)</button>
        <div id="stagedAssignmentBox" style="display:none; margin-top:8px; padding:10px; background:#12202a; border:1px solid #37d6e8; border-radius:4px">
          <div style="font-size:12px; font-weight:bold; color:#37d6e8; margin-bottom:4px">🎯 Staged Attacks Ready (<span id="stagedCount">0</span> desks)</div>
          <div id="stagedSummary" style="font-size:11px; color:#8aa0ac; max-height:120px; overflow-y:auto; margin-bottom:8px"></div>
          <button id="btnFireAssigned" onclick="fireAssigned()" style="width:100%; background:#8b1c1c; border-color:#e5533d; color:#fff; font-weight:bold; padding:8px 12px; cursor:pointer">&#x1F680; FIRE ASSIGNED ATTACKS</button>
        </div>
      </div>
      <div id="attacksDeck"></div>
    </section>

    <section class="card">
      <h2>Arena Broadcast</h2>
      <input id="broadcastInput" placeholder="Announcement text to all kiosks..." style="width:100%; margin-bottom:0.5rem">
      <button id="btnSendBroadcast" style="width:100%">Send Alert Toast</button>
    </section>
  </aside>

  <!-- Right Side: Live Dashboard -->
  <div style="display:flex; flex-direction:column; gap:1rem">
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="showTab('kiosks', this)">Defender Grid (<span id="countKiosks">0</span>)</button>
      <button class="tab-btn" onclick="showTab('board', this)">Live Leaderboard</button>
      <button class="tab-btn" onclick="showTab('events', this)">Audit Event Log</button>
    </div>

    <!-- Tab 1: Kiosks Grid -->
    <section id="tabKiosks" class="card" style="flex:1">
      <div class="tiles-grid" id="kiosksGrid">
        <div style="color:var(--mute)">No kiosks connected yet.</div>
      </div>
    </section>

    <!-- Tab 2: Leaderboard Table -->
    <section id="tabBoard" class="card" style="flex:1; display:none">
      <table>
        <thead>
          <tr>
            <th style="width:60px">Rank</th>
            <th>Defender ID</th>
            <th>Solved</th>
            <th>Total Score</th>
          </tr>
        </thead>
        <tbody id="boardBody"></tbody>
      </table>
    </section>

    <!-- Tab 3: Event Log -->
    <section id="tabEvents" class="card" style="flex:1; display:none">
      <div style="max-height: 600px; overflow-y:auto">
        <table>
          <thead>
            <tr>
              <th style="width:70px">ID</th>
              <th style="width:140px">Timestamp</th>
              <th style="width:130px">Event Type</th>
              <th style="width:100px">Target</th>
              <th>Payload Details</th>
            </tr>
          </thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<!-- Participant Detail Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-hdr">
      <h3 id="mTitle" style="margin:0">Participant Details</h3>
      <button onclick="closeModal()" style="padding:0.2rem 0.5rem">&times;</button>
    </div>
    <div class="modal-body" id="mBody">
      Loading scorecard...
    </div>
  </div>
</div>

<script src="/signalr.min.js"></script>
<script>
let ATTACKS = [];

const $ = id => document.getElementById(id);
const getHeaders = () => ({ 'X-Admin-Key': $('adminKey').value, 'Content-Type': 'application/json' });
const post = (url, body) => fetch(url, { method: 'POST', headers: getHeaders(), body: body ? JSON.stringify(body) : undefined });

// Load key injected by AdminWindow (--) or saved key
const savedKey = localStorage.getItem('breachAdminKey');
if (window.__ADMIN_KEY) {
  $('adminKey').value = window.__ADMIN_KEY;
  localStorage.setItem('breachAdminKey', window.__ADMIN_KEY);
} else if (savedKey && savedKey !== 'change-me-locally' && savedKey !== 'CHANGE-ME-BEFORE-EVENT') {
  $('adminKey').value = savedKey;
} else {
  $('adminKey').value = 'LocalDevAdminKey_2026_Secure123';
  localStorage.setItem('breachAdminKey', 'LocalDevAdminKey_2026_Secure123');
}
$('adminKey').addEventListener('input', () => {
  localStorage.setItem('breachAdminKey', $('adminKey').value);
  try { hubConn.invoke('JoinAdmin', $('adminKey').value); } catch(_) {}
  refreshAttacks();
  refreshKiosks();
  refreshLeaderboard();
});

async function refreshAttacks() {
  try {
    const res = await fetch('/api/admin/attacks', { headers: getHeaders() });
    if (!res.ok) {
      $('attacksDeck').innerHTML = `<div style="color:var(--mute); font-size:12px">Authenticate Admin Key to load attacks (HTTP ${res.status}).</div>`;
      return;
    }
    ATTACKS = await res.json();
    const groups = [
      { label: 'Table 1: Easy (Band 1)', items: ATTACKS.filter(a => a.band <= 1) },
      { label: 'Table 2: Medium (Band 2-3)', items: ATTACKS.filter(a => a.band >= 2 && a.band <= 3) },
      { label: 'Table 3: Hard (Band 4-5)', items: ATTACKS.filter(a => a.band >= 4) }
    ];
    $('attacksDeck').innerHTML = groups.map(g => `
      <div style="margin-bottom:12px">
        <div style="font-size:11px; font-weight:700; color:var(--cyan); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px">${g.label}</div>
        <table style="font-size:12px">
          <thead><tr><th>#</th><th>Attack</th><th>Slot</th><th>Action</th></tr></thead>
          <tbody>
            ${g.items.length === 0 ? '<tr><td colspan="4" style="color:var(--mute)">None</td></tr>' : g.items.map(a => `
              <tr>
                <td>#${a.id}</td>
                <td><strong>${a.title}</strong><div style="font-size:10px;color:var(--mute)">${a.codename || ''} &bull; ${a.state}</div></td>
                <td>${a.sequenceSlot || 'reserve'}</td>
                <td><button class="btn-danger" style="padding:3px 8px;font-size:11px" onclick="fireAttack(${a.id}, '${String(a.title).replace(/'/g, "\\'")}')">&#x1F680; Fire</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `).join('');
  } catch (err) {
    $('attacksDeck').innerHTML = `<div style="color:var(--accent); font-size:12px">Failed to load attacks: ${err.message}</div>`;
  }
}

async function assignGroups() {
  if (!confirm('Stage different attacks in groups of 5 desks across Easy / Medium / Hard? (You will have a Fire button to launch manually)')) return;
  const res = await post('/api/admin/assign-groups');
  if (res.ok) {
    const data = await res.json();
    const box = $('stagedAssignmentBox');
    $('stagedCount').textContent = data.totalAssigned;
    let summaryHtml = '';
    const groups = {};
    for (const a of data.assignments) {
      if (!groups[a.group]) groups[a.group] = { attack: a.attackName, desks: [] };
      groups[a.group].desks.push(a.deskId);
    }
    for (const [grp, info] of Object.entries(groups)) {
      summaryHtml += `<div style="margin-bottom:3px"><strong>Group ${grp}:</strong> ${info.attack} (${info.desks.join(', ')})</div>`;
    }
    $('stagedSummary').innerHTML = summaryHtml;
    box.style.display = 'block';
    alert(`Staged attacks for ${data.totalAssigned} participants in ${Object.keys(groups).length} groups. Review the staged plan and click 'FIRE ASSIGNED ATTACKS' when ready.`);
  } else {
    alert(`Failed to stage groups (HTTP ${res.status}). Verify your Admin Key.`);
  }
}

async function fireAssigned() {
  const count = $('stagedCount').textContent;
  if (!confirm(`CONFIRM ATTACK WAVE\n\nFire the staged attacks across all ${count} participants now?`)) return;
  const res = await post('/api/admin/fire-assigned');
  if (res.ok) {
    const data = await res.json();
    alert(`🚀 Attack wave launched! Dispatched to ${data.totalFired} participants.`);
    $('stagedAssignmentBox').style.display = 'none';
    refreshAttacks();
    refreshKiosks();
  } else {
    alert(`Failed to fire assigned attacks (HTTP ${res.status}).`);
  }
}

async function fireAttack(id, name) {
  const target = $('targetScope').value;
  const targetDesc = target ? `Target Kiosk: ${target}` : 'ALL ACTIVE NODES';
  if (!confirm(`CONFIRM INTRUSION DISPATCH\n\nAttack: #${id} ${name}\nTarget: ${targetDesc}\n\nProceed with payload landing?`)) return;
  const res = target
    ? await post(`/admin/attacks/${id}/fire?targetId=${encodeURIComponent(target)}`)
    : await post(`/api/admin/attacks/${id}/fire-arena`);
  if (res.ok) {
    alert(`Intrusion #${id} dispatched successfully!`);
    refreshAttacks();
  } else {
    alert(`Failed to dispatch attack (HTTP ${res.status}): ${res.statusText}\nPlease verify your Admin Key in the top right header.`);
  }
}

// Global actions
$('btnPause').onclick = () => post('/admin/pause');
$('btnResume').onclick = () => post('/admin/resume');
$('btnFreeze').onclick = async () => {
  const res = await post('/admin/scoreboard/freeze');
  if (res.ok) {
    const data = await res.json();
    alert(`Scoreboard is now ${data.frozen ? 'FROZEN (Top scores masked)' : 'UNFROZEN'}`);
  }
};
$('btnExport').onclick = () => {
  window.open(`/admin/export/ledger?key=${encodeURIComponent($('adminKey').value)}`, '_blank');
};
$('btnResetSession').onclick = async () => {
  if (!confirm('🚨 CRITICAL DANGER: RESET EVENT DATA?\n\nThis will completely wipe all participant registrations, submissions, and the score ledger!\n\nAre you sure you want to proceed?')) return;
  const res = await post('/api/admin/reset-session');
  if (res.ok) {
    alert('✓ Event data and participant sessions have been completely wiped.');
    refreshAll(true);
  } else {
    alert(`Failed to reset session data (HTTP ${res.status}). Verify your Admin Key.`);
  }
};
$('btnRefresh').onclick = () => refreshAll(true);
$('btnSendBroadcast').onclick = () => {
  const msg = $('broadcastInput').value.trim();
  if (msg) {
    post('/admin/broadcast', { message: msg });
    $('broadcastInput').value = '';
  }
};

async function refreshAll(manual = false) {
  const btn = $('btnRefresh');
  if (manual && btn) {
    btn.disabled = true;
    btn.textContent = '↻ Refreshing...';
  }
  try {
    await Promise.allSettled([
      refreshAttacks(),
      refreshKiosks(),
      refreshLeaderboard(),
      refreshEvents(),
      refreshBackupStatus()
    ]);
    if (manual && btn) btn.textContent = '✓ Refreshed';
  } finally {
    if (manual && btn) {
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '↻ Refresh';
      }, 900);
    }
  }
}

function showTab(tab, btn) {
  $('tabKiosks').style.display = tab === 'kiosks' ? 'block' : 'none';
  $('tabBoard').style.display = tab === 'board' ? 'block' : 'none';
  $('tabEvents').style.display = tab === 'events' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (tab === 'board') refreshLeaderboard();
  if (tab === 'events') refreshEvents();
}

let kiosksCache = [];

async function refreshKiosks() {
  let res;
  try {
    res = await fetch('/admin/kiosks', { headers: getHeaders() });
  } catch (err) {
    $('kiosksGrid').innerHTML = `<div style="color:var(--accent)">Network error contacting server: ${err.message}</div>`;
    return;
  }
  if (!res.ok) {
    if (res.status === 401) {
      $('kiosksGrid').innerHTML = '<div style="color:var(--accent); font-weight:700; padding:1rem">Invalid Admin Key (401 Unauthorized). Please check your Admin Key in the top right.</div>';
    }
    return;
  }
  kiosksCache = await res.json();
  const activeKiosks = kiosksCache.filter(k => k.isConnected === true || k.status === 'disqualified');
  $('countKiosks').textContent = `${activeKiosks.length} online (${kiosksCache.length} total)`;

  // Update target selector dropdown
  const currentTarget = $('targetScope').value;
  let options = '<option value="">&bull; ALL ACTIVE PARTICIPANTS</option>';
  for (const k of activeKiosks) {
    options += `<option value="${k.id}">${k.name} (${k.id})</option>`;
  }
  $('targetScope').innerHTML = options;
  $('targetScope').value = currentTarget;

  // Render Grid Tiles (Only show active connected devices)
  if (activeKiosks.length === 0) {
    $('kiosksGrid').innerHTML = `<div style="color:var(--mute); padding:1rem">No active kiosks connected right now. (${kiosksCache.length} registered in database)</div>`;
  } else {
    $('kiosksGrid').innerHTML = activeKiosks.map(k => {
      let isDead = k.status === 'disqualified';
      let cardClass = isDead ? 'kiosk-card dead' : (k.agyExhausted ? 'kiosk-card warn-quota' : 'kiosk-card');
      return `
        <div class="${cardClass}" onclick="openModal('${k.id}')">
          <div class="kc-head">
            <span>${k.id}</span>
            <span>&#x2705; ${k.solvedCount}/7</span>
          </div>
          <div class="kc-name">${k.name}</div>
          <div class="kc-score">${k.totalScore.toFixed(1)}</div>
          <div class="kc-footer">
            <span>${k.agyExhausted ? 'OC mode' : 'agy'}</span>
            <span style="${k.isConnected ? 'color:var(--ok); font-weight:700' : 'color:var(--mute)'}">${k.isConnected ? '● online' : k.status}</span>
          </div>
        </div>
      `;
    }).join('');
  }
}

async function refreshLeaderboard() {
  const res = await fetch('/admin/leaderboard', { headers: getHeaders() });
  if (!res.ok) return;
  const board = await res.json();
  $('boardBody').innerHTML = board.map(b => `
    <tr>
      <td><strong>#${b.rank}</strong></td>
      <td>${b.participantId}</td>
      <td>&#x2705; ${b.solved} / 7</td>
      <td><strong style="color:var(--ok)">${b.score.toFixed(1)}</strong></td>
    </tr>
  `).join('');
}

async function refreshEvents() {
  const res = await fetch('/admin/events', { headers: getHeaders() });
  if (!res.ok) return;
  const events = await res.json();
  $('eventsBody').innerHTML = events.map(e => `
    <tr>
      <td>${e.id}</td>
      <td style="font-size:11px; color:var(--mute)">${e.ts.substring(11, 19)}</td>
      <td><span style="font-weight:700">${e.type}</span></td>
      <td>${e.participantId || '-'}</td>
      <td style="font-family:monospace; font-size:11px">${e.payload}</td>
    </tr>
  `).join('');
}

async function openModal(id) {
  $('modal').style.display = 'grid';
  $('mTitle').textContent = `Participant Scorecard: ${id}`;
  $('mBody').innerHTML = 'Loading detailed audit trail...';

  const res = await fetch(`/admin/kiosks/${id}`, { headers: getHeaders() });
  if (!res.ok) {
    $('mBody').innerHTML = 'Error loading participant data.';
    return;
  }
  const data = await res.json();
  const p = data.participant;

  let deliveriesHtml = data.deliveries.length ? data.deliveries.map(d => `
    <li>Attack #${d.attackId}: Landed ${d.landedAt ? d.landedAt.substring(11, 19) : 'Pending'} | Solved: ${d.solvedAt ? '<span style="color:var(--ok)">' + d.solvedAt.substring(11, 19) + '</span>' : '<span style="color:var(--accent)">UNSOLVED</span>'}</li>
  `).join('') : '<li>No attacks landed yet.</li>';

  let ledgerHtml = data.ledger.length ? data.ledger.map(l => `
    <tr>
      <td>#${l.id}</td>
      <td>Attack ${l.attackId || '-'}</td>
      <td>${l.component}</td>
      <td style="color:${l.points >= 0 ? 'var(--ok)' : 'var(--accent)'}"><strong>${l.points > 0 ? '+' : ''}${l.points.toFixed(1)}</strong></td>
      <td>${l.reason}</td>
    </tr>
  `).join('') : '<tr><td colspan="5">No score ledger transactions.</td></tr>';

  $('mBody').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--panel-sub); padding:0.8rem; border-radius:6px">
      <div>
        <div style="font-size:1.1rem; font-weight:800">${p.name} (${p.id})</div>
        <div style="color:var(--mute); font-size:12px">Kiosk Hostname: ${p.kioskId} &bull; Registered: ${p.createdAt.substring(11, 19)} &bull; Status: <span style="color:${p.status === 'disqualified' ? 'var(--accent)' : 'var(--ok)'}; font-weight:700">${(p.status || 'ONLINE').toUpperCase()}</span></div>
        <div style="margin-top:4px; font-size:12px">Git Branch: <code style="color:var(--cyan)">${p.gitBranch}</code></div>
      </div>
      <div>
        ${p.status === 'disqualified' || p.status === 'eliminated'
          ? `<span style="color:var(--accent); font-weight:800; border:1px solid var(--accent); padding:4px 8px; border-radius:4px">DISQUALIFIED</span>`
          : `<button class="btn-danger" onclick="disqualifyParticipant('${p.id}')">Disqualify</button>`}
      </div>
    </div>

    <div>
      <h4 style="margin:0.5rem 0">Attack Deliveries</h4>
      <ul style="margin:0; padding-left:1.2rem; font-size:12px">${deliveriesHtml}</ul>
    </div>

    <div>
      <h4 style="margin:0.5rem 0">Score Ledger (Append-Only Audit Trail)</h4>
      <div style="max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:4px">
        <table>
          <thead><tr><th>ID</th><th>Target</th><th>Comp</th><th>Points</th><th>Verdict Details</th></tr></thead>
          <tbody>${ledgerHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

async function disqualifyParticipant(id) {
  if (!confirm(`Are you sure you want to DISQUALIFY participant ${id}?`)) return;
  await post(`/admin/kiosks/${id}/disqualify`);
  closeModal();
  refreshKiosks();
}

function closeModal() { $('modal').style.display = 'none'; }

// SignalR Realtime connection
const hubConn = new signalR.HubConnectionBuilder().withUrl('/hub').withAutomaticReconnect().build();
hubConn.on('KIOSK_UPDATED', () => { refreshKiosks(); refreshLeaderboard(); });
hubConn.on('VERDICT', () => { refreshKiosks(); refreshLeaderboard(); });
hubConn.on('PAUSED', () => $('btnPause').textContent = '⏸ Paused (Active)');
hubConn.on('RESUMED', () => $('btnPause').textContent = '⏸ Pause Event');

async function refreshBackupStatus() {
  try {
    const res = await fetch('/admin/backup/status', { headers: getHeaders() });
    if (!res.ok) {
      $('backupStatus').textContent = '💾 Backup: Auth Required';
      $('backupStatus').style.background = '';
      $('backupStatus').style.borderColor = 'var(--border)';
      $('backupStatus').style.color = 'var(--mute)';
      return;
    }
    const b = await res.json();
    if (b.isWarning) {
      $('backupStatus').textContent = `⚠️ BACKUP STALE (${b.backupAgeMinutes}m ago)`;
      $('backupStatus').style.background = '#ffebee';
      $('backupStatus').style.borderColor = '#c62828';
      $('backupStatus').style.color = '#c62828';
      $('backupStatus').style.fontWeight = '700';
    } else {
      $('backupStatus').textContent = `💾 Backup OK (${b.backupAgeMinutes}m ago)`;
      $('backupStatus').style.background = '#e8f5e9';
      $('backupStatus').style.borderColor = '#2e7d32';
      $('backupStatus').style.color = '#2e7d32';
      $('backupStatus').style.fontWeight = '600';
    }
  } catch (_) {
    $('backupStatus').textContent = '💾 Backup: Offline';
  }
}

hubConn.start().then(() => {
  $('connStatus').textContent = 'Online';
  $('connStatus').className = 'status-pill online';
  hubConn.invoke('JoinAdmin', $('adminKey').value);
  refreshAttacks();
  refreshKiosks();
  refreshLeaderboard();
  refreshBackupStatus();
}).catch(e => {
  $('connStatus').textContent = 'Offline';
  refreshAttacks();
});

setInterval(() => { refreshKiosks(); refreshLeaderboard(); }, 8000);
setInterval(refreshBackupStatus, 15000);
</script>
</body>
</html>
