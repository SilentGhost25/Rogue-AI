<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rogue AI — Admin Login</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand-badge">THE BREACH PROTOCOL</div>
    <h1>Control Plane Login</h1>
    <p class="subtitle">Enter organizer credentials to manage the arena.</p>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn-submit" class="btn primary full">Authenticate Session</button>
      <div id="err" class="alert-error" style="display: none;" role="alert"></div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('err');
      const btn = document.getElementById('btn-submit');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      const fd = new FormData(e.target);
      try {
        const res = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(fd))
        });

        if (res.ok) {
          window.location.href = '/admin/';
        } else {
          errEl.textContent = 'Invalid username or password.';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Connection error reaching Control Plane.';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Authenticate Session';
      }
    };
  </script>
</body>
</html>
