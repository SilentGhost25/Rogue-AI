hints:
  - tier: 1
    cost: 500
    text: "Janus Knot is an interlocking cascade across the presentation layer, session state, and persistence engine. Solving one layer alone will not stabilize the system."
  - tier: 2
    cost: 1000
    text: "Investigate presentation layer defacement in the root views, and inspect session lifecycle management in the authentication module for premature eviction traps."
  - tier: 3
    cost: 1500
    text: "Audit initialization routines in the database layer. Search for asynchronous crash triggers or unhandled checkpoint timer traps that kill the server process."
