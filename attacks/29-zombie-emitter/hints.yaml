hints:
  - tier: 1
    cost: 500
    text: "Ignore the decoy alert regarding threadpool starvation and scrypt workers. The issue is an EventEmitter memory leak in routes/traffic.js."
  - tier: 2
    cost: 1000
    text: "Check /api/traffic/events/subscribe in routes/traffic.js. Notice how signalEmitter.on adds a listener on every single request."
  - tier: 3
    cost: 1500
    text: "Change signalEmitter.on to signalEmitter.once, or explicitly remove the listener after emitting the event. Do NOT merely call setMaxListeners."
