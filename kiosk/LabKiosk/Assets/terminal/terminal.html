<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1218; overflow: hidden; }
  #term { position: absolute; inset: 6px 0 0 10px; }
  #fatal { color: #e5533d; font: 14px Consolas, monospace; padding: 16px; display: none; }
</style>
</head>
<body>
<div id="term"></div>
<div id="fatal"></div>
<script>
// Local copies first (Assets/terminal, put there by scripts/vendor-assets), CDN as a pinned fallback.
const SOURCES = {
  css: ['xterm.css', 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css'],
  xterm: ['xterm.js', 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js'],
  fit: ['xterm-addon-fit.js', 'https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js'],
};
const load = (tag, attr, url, extra = {}) => new Promise((ok, no) => {
  const el = document.createElement(tag); Object.assign(el, extra); el[attr] = url; el.onload = ok; el.onerror = no; document.head.append(el);
});
const first = async (tag, attr, urls, extra) => { for (const u of urls) { try { await load(tag, attr, u, extra); return; } catch {} } throw new Error('missing ' + urls[0]); };
const post = (m) => window.chrome.webview.postMessage(m);

(async () => {
  try {
    await first('link', 'href', SOURCES.css, { rel: 'stylesheet' });
    await first('script', 'src', SOURCES.xterm);
    await first('script', 'src', SOURCES.fit);
  } catch (e) {
    const f = document.getElementById('fatal');
    f.style.display = 'block';
    f.textContent = 'Terminal files are missing (' + e.message + '). Run scripts/vendor-assets before building the kiosk.';
    return;
  }

  const term = new Terminal({
    fontFamily: '"Cascadia Mono", Consolas, monospace', fontSize: 15, cursorBlink: true, scrollback: 5000,
    theme: { background: '#0a1218', foreground: '#e6eef2', cursor: '#e5533d', selectionBackground: '#26404d' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));

  const ensureFitted = () => {
    try {
      const el = document.getElementById('term');
      if (el && el.clientWidth > 20 && el.clientHeight > 20) {
        fit.fit();
        if (term.cols > 0 && term.rows > 0) {
          post({ type: 'resize', cols: term.cols, rows: term.rows });
        }
      }
    } catch {}
  };
  window.ensureFitted = ensureFitted;
  window.fit = fit;
  window.term = term;

  ensureFitted();
  requestAnimationFrame(ensureFitted);
  [50, 150, 300, 600, 1000, 1500, 2500].forEach(ms => setTimeout(ensureFitted, ms));

  let locked = false, ended = false;
  term.onData((d) => {
    if (locked) return;
    if (ended) {
      if (d === '\r' || d === '\n') {
        ended = false;
        post({ type: 'restart' });
      }
      return;
    }
    post({ type: 'input', data: d });
  });
  term.onResize(({ cols, rows }) => {
    if (cols > 0 && rows > 0) post({ type: 'resize', cols, rows });
  });

  const ro = new ResizeObserver(() => { ensureFitted(); });
  ro.observe(document.body);
  const termEl = document.getElementById('term');
  if (termEl) ro.observe(termEl);

  window.chrome.webview.addEventListener('message', (e) => {
    const m = e.data;
    if (m.type === 'output') {
      ended = false;
      term.write(m.data);
    }
    else if (m.type === 'clear') {
      ended = false;
      term.reset();
    }
    else if (m.type === 'status') {
      ended = false;
      term.write('\x1b[90m' + m.text + '\x1b[0m\r\n');
    }
    else if (m.type === 'started') {
      ended = false;
      locked = false;
      focusDOM();
    }
    else if (m.type === 'ended') {
      ended = true;
      term.write('\r\n\x1b[90m[session ended] Press Enter to start it again.\x1b[0m\r\n');
    }
    else if (m.type === 'locked') {
      locked = true;
      term.write('\r\n\x1b[31m' + m.text + '\x1b[0m\r\n');
    }
    else if (m.type === 'unlocked') {
      locked = false;
      ended = false;
      term.reset();
      focusDOM();
    }
    else if (m.type === 'focus') {
      focusDOM();
    }
  });

  window.term = term;
  const focusDOM = () => {
    try {
      if (term) {
        term.focus();
        if (term.textarea) term.textarea.focus();
      }
    } catch (e) {}
  };

  focusDOM();
  window.addEventListener('focus', focusDOM);
  window.addEventListener('mousedown', focusDOM);
  window.addEventListener('pointerdown', focusDOM);
  document.addEventListener('mousedown', focusDOM);
  document.addEventListener('pointerdown', focusDOM);
  document.addEventListener('click', focusDOM);
  window.addEventListener('keydown', (e) => {
    if (!locked && term && term.textarea && document.activeElement !== term.textarea) {
      focusDOM();
    }
  }, true);
  setInterval(() => {
    if (!locked && term && term.textarea && document.activeElement !== term.textarea) {
      focusDOM();
    }
  }, 200);
  const c = term.cols > 0 ? term.cols : 100;
  const r = term.rows > 0 ? term.rows : 30;
  post({ type: 'ready', cols: c, rows: r });
})();
</script>
</body>
</html>
